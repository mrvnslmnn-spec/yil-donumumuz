<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mervan ❤️ Havin</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #080607;
            color: white;
            font-family: Georgia, serif;
        }

        .section {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 25px;
        }

        /* AÇILIŞ */

        #hero {
            background:
                radial-gradient(
                    circle at center,
                    #2a1a24 0%,
                    #120b10 45%,
                    #050505 100%
                );
        }

        .hero-content {
            animation: fadeIn 2s ease;
        }

        .names {
            font-size: 50px;
            letter-spacing: 3px;
            margin-bottom: 25px;
            font-weight: normal;
        }

        .heart {
            color: #d4af37;
            margin: 0 10px;
        }

        .line {
            width: 80px;
            height: 1px;
            background: #d4af37;
            margin: 0 auto 30px;
        }

        h1 {
            font-size: 32px;
            font-weight: normal;
            margin-bottom: 15px;
        }

        .subtitle {
            color: #c8bfc3;
            font-size: 18px;
            font-style: italic;
            margin-bottom: 40px;
        }

        button {
            background: transparent;
            color: #d4af37;
            border: 1px solid #d4af37;
            padding: 15px 35px;
            font-size: 16px;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 3px;
            transition: 0.4s;
        }

        button:hover {
            background: #d4af37;
            color: #120b10;
            transform: scale(1.05);
        }

        /* İLK HİKAYE BÖLÜMÜ */

        #story {
            background:
                linear-gradient(
                    135deg,
                    #100b0e,
                    #1c1118,
                    #090708
                );
        }

        .story-content {
            max-width: 750px;
            animation: fadeIn 1.5s ease;
        }

        .story-small {
            color: #d4af37;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .story-content h2 {
            font-size: 42px;
            font-weight: normal;
            margin-bottom: 25px;
        }

        .story-content p {
            color: #cfc7ca;
            font-size: 19px;
            line-height: 1.9;
        }

        .story-heart {
            color: #d4af37;
            font-size: 35px;
            margin-top: 35px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {

            .names {
                font-size: 35px;
            }

            h1 {
                font-size: 25px;
            }

            .story-content h2 {
                font-size: 32px;
            }

            .story-content p {
                font-size: 17px;
            }
        }
        .memory-card {
    margin-top: 45px;
    padding: 30px;
    border: 1px solid rgba(212, 175, 55, 0.35);
    background: rgba(255, 255, 255, 0.03);
    border-radius: 5px;
}

.photo-placeholder {
    width: 280px;
    height: 330px;
    margin: 0 auto 25px;

    display: flex;
    justify-content: center;
    align-items: center;

    border: 1px solid rgba(212, 175, 55, 0.4);

    color: #d4af37;
    font-size: 40px;

    background:
        linear-gradient(
            135deg,
            #21151c,
            #0b080a
        );
}

.memory-card h3 {
    font-size: 25px;
    font-weight: normal;
    margin-bottom: 15px;
}

.memory-card p {
    color: #bdb5b8;
    font-size: 16px;
    line-height: 1.7;
}
  .memory-photo {
    width: 280px;
    height: 330px;
    object-fit: cover;
    display: block;
    margin: 0 auto 25px;
    border: 1px solid rgba(212, 175, 55, 0.4);
}      
    </style>
</head>

<body>

    <!-- AÇILIŞ -->

    <section class="section" id="hero">

        <div class="hero-content">

            <div class="names">
                Mervan <span class="heart">♥</span> Havin
            </div>

            <div class="line"></div>

            <h1>
                Birinci yılımızın hikâyesine hoş geldin.
            </h1>

            <p class="subtitle">
                Seninle geçen ilk 365 gün...
            </p>

            <button onclick="startStory()">
                Hikâyemize Başla →
            </button>

        </div>

    </section>


    <!-- İLK HİKAYE BÖLÜMÜ -->

    <section class="section" id="story">

        <div class="story-content">

            <div class="story-small">
                Birinci yılımız
            </div>

            <h2>
                Her şey bir gün başladı...
            </h2>

            <p>
                Ve o gün, hayatımın en güzel başlangıçlarından
                biri oldu.
            </p>

            <div class="story-heart">
                ♥
            </div>
<div class="memory-card">

   <img src="images/1.jpg" class="memory-photo" alt="İlk anımız">
    
    <h3>İlk anımız</h3>

    <p>
        Bazen bir insanın hayatına ne zaman
        bu kadar güzel bir şekilde girdiğini
        fark edemezsin.
    </p>

</div>
        </div>

    </section>


    <script>

        function startStory() {

            document.getElementById("story").scrollIntoView({
                behavior: "smooth"
            });

        }
</script>
<script src="photos.js"></script>

</body>
</html>
