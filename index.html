<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mervan ❤️ Havin</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#080607;
    color:#fff;
    font-family:Georgia,serif;
}

.section{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:60px 25px;
}

/* AÇILIŞ */

#hero{
    background:
    radial-gradient(circle at center,#2a1a24 0%,#120b10 45%,#050505 100%);
}

.hero-content{
    animation:fadeIn 2s ease;
}

.names{
    font-size:50px;
    letter-spacing:3px;
    margin-bottom:25px;
    font-weight:normal;
}

.heart{
    color:#d4af37;
    margin:0 10px;
}

.line{
    width:80px;
    height:1px;
    background:#d4af37;
    margin:0 auto 30px;
}

h1{
    font-size:32px;
    font-weight:normal;
    margin-bottom:15px;
}

.subtitle{
    color:#c8bfc3;
    font-size:18px;
    font-style:italic;
    margin-bottom:40px;
}

button{
    background:transparent;
    color:#d4af37;
    border:1px solid #d4af37;
    padding:15px 35px;
    font-size:16px;
    letter-spacing:2px;
    cursor:pointer;
    border-radius:3px;
    transition:.4s;
}

button:hover{
    background:#d4af37;
    color:#120b10;
    transform:scale(1.05);
}

/* İLK BÖLÜM */

#story{
    background:
    linear-gradient(135deg,#100b0e,#1c1118,#090708);
}

.story-content{
    width:100%;
    max-width:1000px;
    animation:fadeIn 1.5s ease;
}

.story-small{
    color:#d4af37;
    letter-spacing:4px;
    text-transform:uppercase;
    font-size:13px;
    margin-bottom:25px;
}

.story-content h2{
    font-size:42px;
    font-weight:normal;
    margin-bottom:20px;
}

.story-content p{
    color:#cfc7ca;
    font-size:19px;
    line-height:1.8;
}

/* İLK 3 FOTOĞRAF */

.first-photos{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:22px;
    margin:55px auto 30px;
}

.first-photo{
    width:220px;
    height:300px;
    padding:8px;
    background:#151014;
    border:1px solid rgba(212,175,55,.45);
    box-shadow:0 20px 45px rgba(0,0,0,.55);
    transition:.5s ease;
}

.first-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.photo-left{
    transform:rotate(-6deg) translateY(12px);
}

.photo-center{
    transform:scale(1.03);
    z-index:2;
}

.photo-right{
    transform:rotate(6deg) translateY(12px);
}

.first-photo:hover{
    transform:scale(1.06) rotate(0deg);
    z-index:5;
}

.story-caption{
    color:#c8bfc3;
    font-size:16px;
    font-style:italic;
    margin:20px 0 30px;
}

.story-caption span{
    color:#d4af37;
    margin:0 8px;
}

/* GALERİ */

#gallery{
    background:
    linear-gradient(135deg,#090708,#1b1118,#0b080a);
}

.photo-section{
    width:100%;
    max-width:1100px;
}

.photo-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
    margin:45px auto;
}

.photo-item{
    background:rgba(255,255,255,.03);
    border:1px solid rgba(212,175,55,.3);
    padding:10px;
    transition:.4s ease;
}

.photo-item:hover{
    transform:translateY(-8px);
    border-color:#d4af37;
}

.photo-item img{
    width:100%;
    height:360px;
    object-fit:cover;
    display:block;
}

.photo-number{
    color:#d4af37;
    font-size:15px;
    letter-spacing:2px;
    margin-top:12px;
}

/* ANİMASYON */

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(25px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* TELEFON */

@media(max-width:750px){

    .names{
        font-size:35px;
    }

    h1{
        font-size:25px;
    }

    .story-content h2{
        font-size:32px;
    }

    .story-content p{
        font-size:17px;
    }

    .first-photos{
        gap:7px;
    }

    .first-photo{
        width:30vw;
        height:42vw;
        padding:5px;
    }

    .photo-grid{
        grid-template-columns:1fr;
    }

    .photo-item img{
        height:420px;
    }
}
</style>
</head>

<body>

<!-- AÇILIŞ -->

<section class="section" id="hero">

<div class="hero-content">

<div class="names">
Mervan <span class="heart">♥</span> Havin
</div>

<div class="line"></div>

<h1>
Birinci yılımızın hikâyesine hoş geldin.
</h1>

<div class="subtitle">
Seninle geçen ilk 365 gün...
</div>

<button onclick="startStory()">
Hikâyemize Başla →
</button>

</div>

</section>


<!-- İLK 3 FOTOĞRAF -->

<section class="section" id="story">

    <div class="story-content">

        <div class="story-small">
            BİRİNCİ YILIMIZ
        </div>

        <h2>
            Her şey bir gün başladı...
        </h2>

        <p>
            Ve o gün, hayatımın en güzel başlangıçlarından
            biri oldu.
        </p>

        <div class="first-photos">

            <div class="first-photo photo-left">
                <img src="images/1.jpg" alt="İlk anımız">
            </div>

            <div class="first-photo photo-center">
                <img src="images/2.jpg" alt="İlk anımız">
            </div>

            <div class="first-photo photo-right">
                <img src="images/3.jpg" alt="İlk anımız">
            </div>

        </div>

        <div class="story-caption">
            <span>♥</span>
            İlk anılarımız...
            <span>♥</span>
        </div>

        <button onclick="showGallery()">
            Hikâyemize Devam Et →
        </button>

    </div>

</section>

<!-- GALERİ -->

<section class="section" id="gallery">

<div class="photo-section">

<div class="story-small">
ANILARIMIZ
</div>

<h2>
Birlikte geçen güzel günler...
</h2>

<div class="photo-grid" id="photoGrid"></div>

<button onclick="nextPage()">
Sonraki →
</button>

</div>

</section>


<script>

function startStory(){

document.getElementById("story").scrollIntoView({
behavior:"smooth"
});

function showGallery() {

    currentStory = 0;

    },
    {

        title: "Birlikte...",
        text: "Geçirdiğimiz zamanın her saniyesini ayrı ayrı saklamak isterdim."
    },
    {
        photos: [34, 35, 36],

        text: "Bugün dönüp baktığımda ne kadar güzel bir yıl geçirdiğimizi daha iyi görüyorum."
    },
    {
        photos: [37, 38, 39],

        text: "Bu hikâyenin en güzel tarafı ise henüz bitmemiş olması."
    },
    {
        photos: [40, 41, 42],
        title: "Birinci yılımız...",
        text: "365 gün geçti ama sana olan sevgim ilk günkü heyecanından hiçbir şey kaybetmedi."
    },
    {
        photos: [43, 44],
        title: "Ve daha başlangıç...",
        text: "İlk yılımızın sonuna geldik. Ama bizim hikâyemizin daha yazılacak çok güzel sayfaları var."
    }
];

let currentStory = 0;

function showStory(index) {

    const story = stories[index];
    const gallery = document.getElementById("gallery");

    gallery.querySelector(".story-small").textContent = "BİZİM HİKÂYEMİZ";
    gallery.querySelector("h2").textContent = story.title;

    const paragraph = gallery.querySelector("p");

    if (paragraph) {
        paragraph.textContent = story.text;
    }

    const grid = document.getElementById("photoGrid");

    grid.innerHTML = "";

    story.photos.forEach(function(number) {

        const div = document.createElement("div");

        div.className = "photo-item";

        div.innerHTML =
            '<img src="images/' + number + '.jpg" alt="' + story.title + '">';

        grid.appendChild(div);

    });

    const button = gallery.querySelector("button");

    if (index === stories.length - 1) {
        button.textContent = "Hikâyemizin Sonuna →";
    } else {
        button.textContent = "Hikâyemize Devam Et →";
    }
}

function showGallery() {

    currentStory = 0;

    showStory(0);

    document.getElementById("gallery").scrollIntoView({
        behavior: "smooth"
    });
}

function nextPage() {

    if (currentStory < stories.length - 1) {

        currentStory++;

        showStory(currentStory);

        document.getElementById("gallery").scrollIntoView({
            behavior: "smooth"
        });
    }
}
